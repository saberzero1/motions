name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - uses: saberzero1/obsidian-workflows@v1
              with:
                  mode: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
