name: E2E Tests

on:
    push:
        branches: ['main', 'master']
    pull_request:
        branches: ['main', 'master']
    workflow_dispatch:

jobs:
    discover:
        runs-on: ubuntu-latest
        outputs:
            specs: ${{ steps.find.outputs.specs }}
        steps:
            - uses: actions/checkout@v6
            - id: find
              run: |
                  specs=$(find test/specs -name '*.e2e.ts' | sort | jq -R -s -c 'split("\n") | map(select(. != ""))')
                  echo "specs=$specs" >> "$GITHUB_OUTPUT"

    e2e:
        needs: discover
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository }}/e2e-runner:latest
            env:
                DISPLAY: ':99'
        strategy:
            fail-fast: false
            matrix:
                spec: ${{ fromJson(needs.discover.outputs.specs) }}

        steps:
            - uses: actions/checkout@v6

            - name: Cache npm dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install dependencies
              run: npm install --include=dev

            - name: Build
              run: npm run build:ci-test

            - name: Cache Obsidian
              uses: actions/cache@v5
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json') }}

            - name: Run E2E test
              run: npx wdio run ./wdio.conf.mts --spec '${{ matrix.spec }}'
