name: E2E Tests

on:
    push:
        branches: ['main', 'master']
    pull_request:
        branches: ['main', 'master']
    workflow_dispatch:

jobs:
    discover:
        runs-on: ubuntu-latest
        outputs:
            shards: ${{ steps.shard.outputs.shards }}
        steps:
            - uses: actions/checkout@v6
            - id: shard
              run: |
                  MAX_SHARDS=36
                  specs=$(find test/specs -name '*.e2e.ts' | sort)
                  total=$(echo "$specs" | wc -l)
                  # Use fewer shards when spec count is below MAX_SHARDS
                  if [ "$total" -lt "$MAX_SHARDS" ]; then
                    num_shards=$total
                  else
                    num_shards=$MAX_SHARDS
                  fi
                  # Distribute specs round-robin into shards as a JSON array of arrays
                  shards=$(echo "$specs" | awk -v n="$num_shards" '
                    BEGIN { for (i=0; i<n; i++) a[i]="" }
                    { idx = (NR-1) % n; a[idx] = a[idx] (a[idx]=="" ? "" : ",") $0 }
                    END {
                      printf "["
                      for (i=0; i<n; i++) {
                        if (i>0) printf ","
                        printf "\"%s\"", a[i]
                      }
                      printf "]"
                    }
                  ')
                  echo "shards=$shards" >> "$GITHUB_OUTPUT"

    e2e:
        needs: discover
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository }}/e2e-runner:latest
            env:
                DISPLAY: ':99'
            options: --shm-size=2g
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJson(needs.discover.outputs.shards) }}

        steps:
            - name: Start virtual display
              run: |
                  Xvfb "$DISPLAY" -screen 0 1280x1024x24 +extension GLX -noreset &
                  for _ in $(seq 1 30); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.2; done
                  herbstluftwm &
                  for _ in $(seq 1 30); do herbstclient list_monitors >/dev/null 2>&1 && break; sleep 0.2; done

            - uses: actions/checkout@v6

            - name: Cache npm dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install dependencies
              run: npm install --include=dev

            - name: Build
              run: npm run build:ci-test

            - name: Cache Obsidian
              uses: actions/cache@v5
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json') }}

            - name: Run E2E tests
              run: |
                  SHARD='${{ matrix.shard }}'
                  SPEC_ARGS=$(echo "$SHARD" | tr ',' '\n' | while read -r spec; do printf ' --spec %s' "$spec"; done)
                  npx wdio run ./wdio.conf.mts $SPEC_ARGS

    e2e-cross-platform:
        needs: discover
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
                shard: ${{ fromJson(needs.discover.outputs.shards) }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: false

        steps:
            - uses: actions/checkout@v6

            - name: Disable Windows Defender real-time monitoring
              if: runner.os == 'Windows'
              shell: powershell
              run: Set-MpPreference -DisableRealtimeMonitoring $true

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm install --include=dev

            - name: Build
              run: npm run build:ci-test

            - name: Cache Obsidian
              uses: actions/cache@v5
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json') }}
                  restore-keys: obsidian-cache-${{ runner.os }}-

            - name: Run E2E tests
              shell: bash
              run: |
                  SHARD='${{ matrix.shard }}'
                  SPEC_ARGS=$(echo "$SHARD" | tr ',' '\n' | while read -r spec; do printf ' --spec %s' "$spec"; done)
                  npx wdio run ./wdio.conf.mts $SPEC_ARGS
